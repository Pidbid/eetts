name: Sync Docker Hub description

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/dockerhub-description.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-description
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_IMAGE" || { echo "DOCKERHUB_IMAGE repository variable is missing" >&2; exit 1; }
          test -n "$DOCKERHUB_USERNAME" || { echo "DOCKERHUB_USERNAME secret is missing" >&2; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "DOCKERHUB_TOKEN secret is missing" >&2; exit 1; }
      - name: Update Docker Hub repository overview
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_IMAGE }}
          short-description: Stable Edge TTS HTTP API with Docker, authentication, retries, and multi-arch images.
          readme-filepath: ./README.md
          enable-url-completion: true
